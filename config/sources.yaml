listen_addr: 0.0.0.0:8080

defaults:
  poll_interval: 5m
  request_timeout: 15s
  stale_after: 15m
  max_concurrency: 16
  max_response_bytes: 2097152

sources:
  - id: github
    name: GitHub
    category: developer-tools
    metadata:
      dependency: "Development, source hosting and CI"
      coverage: "Configured GitHub components."
      status_url: "https://www.githubstatus.com/"
      domain: "github.com"
    collector:
      type: statuspage
      base_url: https://www.githubstatus.com/
    include_components:
      - Git Operations
      - Webhooks
      - API Requests
      - Issues
      - Pull Requests
      - Actions
      - Packages
      - Pages
      - Copilot
      - Codespaces

  - id: claude
    name: Claude
    category: developer-tools
    metadata:
      dependency: "Claude and Claude Code"
      coverage: "Configured Claude components."
      status_url: "https://status.claude.com/"
      domain: "anthropic.com"
    collector:
      type: statuspage
      base_url: https://status.claude.com/
    include_components:
      - claude.ai
      - Claude Console (platform.claude.com)
      - Claude API (api.anthropic.com)
      - Claude Code

  - id: twilio
    name: Twilio
    category: customer-critical
    metadata:
      dependency: "Network traversal and telephony API"
      coverage: "Configured Twilio Network Traversal Service and REST API only."
      status_url: "https://status.twilio.com/"
      domain: "twilio.com"
    collector:
      type: statuspage
      base_url: https://status.twilio.com/
    include_components:
      - Network Traversal Service
      - REST API

  - id: jira
    name: Jira
    category: developer-tools
    metadata:
      dependency: "Internal issue tracking"
      coverage: "Jira Software Cloud components."
      status_url: "https://jira-software.status.atlassian.com/"
      domain: "atlassian.com"
    collector:
      type: statuspage
      base_url: https://jira-software.status.atlassian.com/
    include_components:
      - Viewing content
      - Create and edit
      - Authentication and User Management
      - Search
      - Notifications
      - Administration
      - Automation for Jira
      - Webhooks

  - id: sentry
    name: Sentry
    category: ops-analytics
    metadata:
      dependency: "Error ingestion and SOC diagnostics"
      coverage: "Configured Sentry ingestion and notification components."
      status_url: "https://status.sentry.io/"
      domain: "sentry.io"
    collector:
      type: statuspage
      base_url: https://status.sentry.io/
    include_components:
      - Dashboard
      - API
      - Password-Based
      - SAML-Based Single Sign-On
      - US Error Ingestion
      - EU Error Ingestion
      - US Errors Alerting
      - EU Errors Alerting
      - Email
      - Microsoft Teams

  - id: segment
    name: Segment
    category: ops-analytics
    metadata:
      dependency: "Event ingestion and analytics"
      coverage: "Configured US and EU ingestion, API and web components."
      status_url: "https://status.segment.com/"
      domain: "segment.com"
    collector:
      type: statuspage
      base_url: https://status.segment.com/
    include_components:
      - Data Ingestion (Tracking) API (US)
      - Data Ingestion (Tracking) API (EU)
      - Public API (US)
      - Public API (EU)
      - Web Interface (US)
      - Web Interface (EU)

  - id: hubspot
    name: HubSpot
    category: crm
    metadata:
      dependency: "Browser CTI for HubSpot customers"
      coverage: "Configured CRM, API and integration components."
      status_url: "https://status.hubspot.com/"
      domain: "hubspot.com"
    collector:
      type: statuspage
      base_url: https://status.hubspot.com/
    include_components:
      - CRM
      - HubSpot APIs
      - Integrations
      - Developer Tools

  - id: elevenlabs
    name: ElevenLabs
    category: ai
    metadata:
      dependency: "AI voice integration"
      coverage: "Public page-level status."
      status_url: "https://status.elevenlabs.io/"
      domain: "elevenlabs.io"
    collector:
      type: statuspage
      base_url: https://status.elevenlabs.io/

  # Coverage checked against public endpoints on 2026-11-16.

  - id: microsoft
    name: "Microsoft 365 (public advisories)"
    category: customer-critical
    metadata:
      dependency: "Microsoft contacts, calendars, Teams integrations and SSO"
      coverage: "Public emergency advisories only; no tenant credentials needed. Does not replace tenant-specific Graph service health."
      status_url: "https://status.cloud.microsoft/"
      domain: "microsoft.com"
    collector:
      type: microsoft_public
      url: https://status.cloud.microsoft/api/posts/mac

  - id: azure
    name: "Microsoft Azure (public advisories)"
    category: customer-critical
    metadata:
      dependency: "Entra / Azure infrastructure supporting Microsoft integrations"
      coverage: "Public major-impact advisories only; unresolved RSS advisories remain unknown. Not Microsoft 365 tenant service health."
      status_url: "https://azure.status.microsoft/"
      domain: "microsoft.com"
    collector:
      type: feed
      url: https://rssfeed.azure.status.microsoft/en-us/status/feed/

  - id: google-workspace
    name: "Google Workspace"
    category: customer-critical
    metadata:
      dependency: "Google contacts/calendar sync and internal mail/calendar"
      coverage: "Public Workspace incidents; does not verify OAuth, tenant configuration or reCAPTCHA."
      status_url: "https://www.google.com/appsstatus/dashboard/"
      domain: "google.com"
    collector:
      type: google
      url: https://www.google.com/appsstatus/dashboard/incidents.json

  - id: google-cloud
    name: "Google Cloud"
    category: customer-critical
    metadata:
      dependency: "Customer-facing AI: Vertex AI / Gemini for omni errands, chat and transcription"
      coverage: "Public global incidents; reCAPTCHA availability may not be represented."
      status_url: "https://status.cloud.google.com/"
      domain: "cloud.google.com"
    collector:
      type: google
      url: https://status.cloud.google.com/incidents.json

  - id: firebase
    name: "Firebase / FCM"
    category: customer-critical
    metadata:
      dependency: "Android push notifications and incoming call ringing"
      coverage: "Cloud Messaging incidents only; provider-reported status, not end-to-end ringing."
      status_url: "https://status.firebase.google.com/"
      domain: "firebase.google.com"
    collector:
      type: google
      url: https://status.firebase.google.com/incidents.json
    include_components:
      - "Cloud Messaging"

  - id: apple-apns
    name: "Apple APNs"
    category: customer-critical
    metadata:
      dependency: "iOS VoIP push notifications and incoming call ringing"
      coverage: "APNS service in Apple Developer status feed; public undocumented JSONP format."
      status_url: "https://developer.apple.com/system-status/"
      domain: "apple.com"
    collector:
      type: apple
      url: https://www.apple.com/support/systemstatus/data/developer/system_status_en_US.js
    include_components:
      - "APNS"

  - id: meta-whatsapp
    name: "Meta / WhatsApp Business"
    category: customer-critical
    metadata:
      dependency: "WhatsApp Customer Widget and omni messaging"
      coverage: "WhatsApp Business Platform service state from public page data; undocumented format."
      status_url: "https://metastatus.com/whatsapp-business-api"
      domain: "whatsapp.com"
    collector:
      type: meta
      url: https://metastatus.com/data/orgs.json

  - id: bankid
    name: "BankID"
    category: customer-critical
    metadata:
      dependency: "Sign-in and identity verification"
      coverage: "Official public Statuspage API."
      status_url: "https://status.bankid.com/"
      domain: "bankid.com"
    collector:
      type: statuspage
      base_url: https://status.bankid.com/

  - id: freja
    name: "Freja eID (via Signicat)"
    category: customer-critical
    metadata:
      dependency: "Identity verification and sign-in"
      coverage: "Automatic Signicat Freja eID component; third-party integration coverage, not a direct Freja-wide service guarantee."
      status_url: "https://status.signicat.com/"
      domain: "frejaeid.com"
    collector:
      type: statuspage
      base_url: https://status.signicat.com/
    include_components:
      - "Freja eID"

  - id: salesforce
    name: "Salesforce"
    category: crm
    metadata:
      dependency: "Browser CTI for Salesforce customers"
      coverage: "Global production instance status from the public preview endpoint; unrelated instances may affect aggregate state."
      status_url: "https://status.salesforce.com/"
      domain: "salesforce.com"
    collector:
      type: salesforce
      url: https://api.status.salesforce.com/v1/instances/status/preview

  - id: zendesk
    name: "Zendesk"
    category: crm
    metadata:
      dependency: "CTI integration for Zendesk customers"
      coverage: "Automatic public incident JSON; global announcements may not affect every customer pod."
      status_url: "https://status.zendesk.com/"
      domain: "zendesk.com"
    collector:
      type: zendesk
      url: https://status.zendesk.com/api/ssp/incidents.json

  - id: freshdesk
    name: "Freshdesk"
    category: crm
    metadata:
      dependency: "CTI integration for Freshdesk customers"
      coverage: "Public Freshdesk component API across regions. Component state; provider page has incident narratives."
      status_url: "https://status.freshworks.com/"
      domain: "freshworks.com"
    collector:
      type: freshstatus
      url: https://public-api.freshstatus.io/v1/public-components/?account_id=3611

  - id: teamleader
    name: "Teamleader"
    category: crm
    metadata:
      dependency: "Browser CTI for Teamleader customers"
      coverage: "Public Teamleader Focus status; only relevant for customers using this CRM."
      status_url: "https://status.teamleader.eu/"
      domain: "teamleader.eu"
    collector:
      type: statuspage
      base_url: https://status.teamleader.eu/

  - id: upsales
    name: "Upsales"
    category: crm
    metadata:
      dependency: "Browser CTI for Upsales customers"
      coverage: "Public Upsales component status."
      status_url: "https://status.upsales.com/"
      domain: "upsales.com"
    collector:
      type: statuspage
      base_url: https://status.upsales.com/

  - id: pipedrive
    name: "Pipedrive"
    category: crm
    metadata:
      dependency: "CTI integration for Pipedrive customers"
      coverage: "Automatic public component and current-notice HTML parsing; changed markup fails collection."
      status_url: "https://status.pipedrive.com/"
      domain: "pipedrive.com"
    collector:
      type: pipedrive
      url: https://status.pipedrive.com/

  - id: superoffice
    name: "SuperOffice"
    category: crm
    metadata:
      dependency: "Browser CTI for SuperOffice customers"
      coverage: "Public CRM Cloud, login, API and apps."
      status_url: "https://status.superoffice.com/"
      domain: "superoffice.com"
    collector:
      type: statuspage
      base_url: https://status.superoffice.com/
    include_components:
      - "SuperOffice CRM Cloud"
      - "Login services"
      - "API and Apps"

  - id: stripe
    name: "Stripe"
    category: second-tier
    metadata:
      dependency: "Payments and top-ups"
      coverage: "Public Stripe status."
      status_url: "https://status.stripe.com/"
      domain: "stripe.com"
    collector:
      type: statuspage
      base_url: https://www.stripestatus.com/

  - id: adyen
    name: "Adyen"
    category: second-tier
    metadata:
      dependency: "Checkout payments"
      coverage: "Automatic public active incident API; no tenant or merchant credentials."
      status_url: "https://status.adyen.com/"
      domain: "adyen.com"
    collector:
      type: adyen
      url: https://status.adyen.com/api/incident-messages/active

  - id: mapbox
    name: "Mapbox"
    category: second-tier
    metadata:
      dependency: "Maps via api.mapbox.com"
      coverage: "Global Mapbox component status."
      status_url: "https://status.mapbox.com/"
      domain: "mapbox.com"
    collector:
      type: statuspage
      base_url: https://status.mapbox.com/

  - id: aws-s3
    name: "AWS S3 / Frankfurt"
    category: second-tier
    metadata:
      dependency: "Desktop MSI downloads from S3 eu-central-1"
      coverage: "Regional public advisories only; RSS advisories without explicit resolution remain unknown."
      status_url: "https://health.aws.amazon.com/health/status"
      domain: "aws.amazon.com"
    collector:
      type: feed
      url: https://status.aws.amazon.com/rss/s3-eu-central-1.rss

  - id: cloudflare
    name: "Cloudflare / CDN"
    category: second-tier
    metadata:
      dependency: "cdnjs assets on some pages"
      coverage: "CDN/Cache component; cdnjs has no dedicated component in this feed."
      status_url: "https://www.cloudflarestatus.com/"
      domain: "cloudflare.com"
    collector:
      type: statuspage
      base_url: https://www.cloudflarestatus.com/
    include_components:
      - "CDN/Cache"

  - id: spirius
    name: "Spirius"
    category: second-tier
    metadata:
      dependency: "Finland SMS delivery"
      coverage: "Official public Instatus API."
      status_url: "https://spirius.instatus.com/"
      domain: "spirius.com"
    collector:
      type: instatus
      url: https://spirius.instatus.com/v3/summary.json

  - id: slack
    name: "Slack"
    category: internal-tools
    metadata:
      dependency: "Internal team communications"
      coverage: "Official public Slack Status API v2."
      status_url: "https://slack-status.com/"
      domain: "slack.com"
    collector:
      type: slack
      url: https://slack-status.com/api/v2.0.0/current

  - id: 1password
    name: "1Password"
    category: internal-tools
    metadata:
      dependency: "Internal password and secret access"
      coverage: "Global public component status across regions."
      status_url: "https://1password.statuspage.io/"
      domain: "1password.com"
    collector:
      type: statuspage
      base_url: https://1password.statuspage.io/

  - id: confluence
    name: "Confluence"
    category: internal-tools
    metadata:
      dependency: "Internal documentation"
      coverage: "Dedicated Confluence Cloud feed; separate from Jira Software."
      status_url: "https://confluence.status.atlassian.com/"
      domain: "atlassian.com"
    collector:
      type: statuspage
      base_url: https://confluence.status.atlassian.com/

  - id: jsm
    name: "Jira Service Management"
    category: internal-tools
    metadata:
      dependency: "Internal service desk and SOC tickets"
      coverage: "Dedicated JSM Cloud feed; separate from Jira Software."
      status_url: "https://jira-service-management.status.atlassian.com/"
      domain: "atlassian.com"
    collector:
      type: statuspage
      base_url: https://jira-service-management.status.atlassian.com/

  - id: telia
    name: "Telia (Sweden fixed network)"
    category: carriers
    request_timeout: 60s
    metadata:
      country_codes: ["SE"]
      dependency: "Carrier connectivity and customer calls"
      coverage: "Official public fixed-network county and case tables for broadband and IP telephony. TV is excluded. Regional cases do not establish a nationwide or mobile outage; county associations follow map viewports."
      status_url: "https://www.telia.se/support/driftinformation-fast"
      domain: "telia.se"
    collector:
      type: telia
      url: https://glu2.han.telia.se/bios/glup

  - id: telenor
    name: "Telenor (Sweden fixed network)"
    category: carriers
    request_timeout: 60s
    metadata:
      country_codes: ["SE"]
      dependency: "Carrier connectivity and customer calls"
      coverage: "Official public fixed-network outage portal. Local broadband/telephony cases; TV is excluded; no nationwide or mobile health guarantee. County associations follow map viewports."
      status_url: "https://mboss.telenor.se/outageportalfixed/"
      domain: "telenor.se"
    collector:
      type: telenor
      url: https://mboss.telenor.se/outageportalfixed/

  - id: tdc
    name: "TDC / TDC NET"
    category: carriers
    metadata:
      country_codes: ["DK"]
      dependency: "Danish carrier connectivity, customer calls and mobile access"
      coverage: "Official TDC public network incidents for mobile telephony, broadband/IP, access and transport, joined by case ID to the public TDC NET mobile map markers. Local incidents; resolved reports and future planned windows are excluded."
      status_url: "https://tdc.dk/da/kundeservice/driftsinformation"
      domain: "tdc.dk"
    collector:
      type: tdc
      url: https://tdc.dk/api/driftsinfo/getfasdata
    include_components:
      - Mobil Telefoni
      - Mobil Tjenester
      - Telefoni
      - Bredbånd og IP
      - Accesnet
      - Transportnet

  - id: telia-dk
    name: "Telia DK / Norlys"
    category: carriers
    metadata:
      country_codes: ["DK"]
      dependency: "Danish carrier connectivity, customer calls and mobile access"
      coverage: "Official Norlys DataNet, fixed, mobile and UC bulletins and explicit no-known-issues statements; hosting is excluded. Notices more than 24 hours past their repair estimate remain unconfirmed/unknown rather than fresh outage evidence."
      status_url: "https://shop.norlys.dk/kundeservice/mobil/dakning-og-drift/driftsinformation/"
      domain: "norlys.dk"
    collector:
      type: norlys
      url: https://shop.norlys.dk/kundeservice/mobil/dakning-og-drift/driftsinformation/
    include_components:
      - DataNet
      - Fastnet
      - Mobile
      - UC

  - id: proximus
    name: "Proximus (public voice/SMS APIs)"
    category: carriers
    metadata:
      country_codes: ["BE"]
      dependency: "Carrier calls and messaging; public collection covers Enco voice/SMS APIs"
      coverage: "Official Proximus Enco voice, SMS and fixed/mobile unification components and incidents. This feed does not establish Belgian access-network or wholesale trunk health; those account/line-specific services remain outside public coverage."
      status_url: "https://status.enco.io/"
      domain: "proximus.be"
    collector:
      type: statuspage
      base_url: https://status.enco.io/
    include_components:
      - NextGen voice services
      - SMS API
      - Fixed Mobile Unification API

  - id: line-carrier
    name: "Line Carrier"
    category: carriers
    metadata:
      country_codes: ["FI"]
      dependency: "Carrier connectivity and customer calls"
      coverage: "Official Finnish incident RSS; Korjattu titles are resolved. Other bulletins remain active advisories."
      status_url: "https://www.linecarrier.fi/hairiotiedotteet/"
      domain: "linecarrier.fi"
    collector:
      type: feed
      url: https://www.linecarrier.fi/hairiotiedotteet/feed/

  - id: erate
    name: "Erate / Telavox Norway"
    category: carriers
    metadata:
      country_codes: ["NO"]
      dependency: "Norwegian carrier connectivity, mobile services and customer calls"
      coverage: "Erate's public website redirects to Telavox Norway and links this official status page. Collects Norway components and Norway-targeted incidents only; no independent Erate wholesale/MVNO platform feed is exposed."
      status_url: "https://status.telavox.com/"
      domain: "telavox.no"
    collector:
      type: status_io
      url: https://status.io/1.0/status/5c77e330cac2ed049a438709
    include_components:
      - Norway

  - id: dna-fi
    name: "DNA Finland (upstream network map)"
    category: carriers
    metadata:
      country_codes: ["FI"]
      dependency: "Finnish upstream mobile, voice, SMS and broadband network"
      coverage: "Official DNA public outage-map polygons: voice, SMS, ADSL and mobile. Separate from Line Carrier platform status; does not prove that a particular Line Carrier subscription is affected. TV and planned maintenance layers excluded."
      status_url: "https://kartat.dna.fi/Hairiokartta/"
      domain: "dna.fi"
    collector:
      type: dna
      url: https://kartat.dna.fi/Peka4Proxy/Hairiot_julk/MapServer/

  - id: billiant-porting
    name: "Billiant — Belgian number porting"
    category: "customer-critical"
    poll_interval: "1h"
    metadata:
      country_codes: ["BE"]
      dependency: "Belgian inbound number porting via tvx-np-proxy.billiant.com"
      coverage: "Not monitored: Authenticated Belgian porting synthetic required; no verified public incident feed. Do not submit a real porting request as a health check."
      status_url: "https://billiant.com/"
      domain: "billiant.com"
    collector:
      type: "coverage_gap"
      reason: "Authenticated Belgian porting synthetic required; no verified public incident feed. Do not submit a real porting request as a health check."

  - id: billiant-nabs
    name: "Billiant / NABS — TDC provisioning"
    category: "customer-critical"
    poll_interval: "1h"
    metadata:
      country_codes: ["DK"]
      dependency: "Danish mobile provisioning via tvx-nabs-api.billiant.com"
      coverage: "Not monitored: Authenticated read-only NABS synthetic required; no verified public incident feed."
      status_url: "https://billiant.com/"
      domain: "billiant.com"
    collector:
      type: "coverage_gap"
      reason: "Authenticated read-only NABS synthetic required; no verified public incident feed."

  - id: billiant-outbox
    name: "Billiant — outbox events"
    category: "customer-critical"
    poll_interval: "1h"
    metadata:
      country_codes: []
      dependency: "Outbox delivery via tvx-dmo-api.billiant.com"
      coverage: "Not monitored: Authenticated read-only outbox synthetic required; no verified public incident feed."
      status_url: "https://billiant.com/"
      domain: "billiant.com"
    collector:
      type: "coverage_gap"
      reason: "Authenticated read-only outbox synthetic required; no verified public incident feed."

  - id: erate-bss
    name: "Erate — wholesale BSS API"
    category: "customer-critical"
    poll_interval: "1h"
    metadata:
      country_codes: ["NO"]
      dependency: "Wholesale BSS via prod-billiant-wholesale-api-proxy.erate.no"
      coverage: "Not monitored: Authenticated BSS read-only synthetic required. Telavox Norway status does not establish wholesale API health."
      status_url: "https://erate.no/"
      domain: "erate.no"
    collector:
      type: "coverage_gap"
      reason: "Authenticated BSS read-only synthetic required. Telavox Norway status does not establish wholesale API health."

  - id: erate-nrdb
    name: "Erate — NRDB API"
    category: "customer-critical"
    poll_interval: "1h"
    metadata:
      country_codes: ["NO"]
      dependency: "Norwegian number portability via prod-billiant-nrdb-api-proxy.erate.no"
      coverage: "Not monitored: Authenticated NRDB read-only synthetic required; separate from carrier network status."
      status_url: "https://erate.no/"
      domain: "erate.no"
    collector:
      type: "coverage_gap"
      reason: "Authenticated NRDB read-only synthetic required; separate from carrier network status."

  - id: erate-cdr
    name: "Erate — CDR / file delivery"
    category: "customer-critical"
    poll_interval: "1h"
    metadata:
      country_codes: ["NO"]
      dependency: "CDR file retrieval from osl1ftp1.erate.no"
      coverage: "Not monitored: SFTP directory and file-freshness check requires the existing production integration credentials; public web status is insufficient."
      status_url: "https://erate.no/"
      domain: "erate.no"
    collector:
      type: "coverage_gap"
      reason: "SFTP directory and file-freshness check requires the existing production integration credentials; public web status is insufficient."

  - id: colt
    name: "Colt — number management API"
    category: "customer-critical"
    poll_interval: "1h"
    metadata:
      country_codes: []
      dependency: "Number and address management on apis.colt.net/numberManagement"
      coverage: "Not monitored: Authenticated read-only Apigee number-management synthetic required. Retired SOAP host is excluded."
      status_url: "https://developer.colt.net/"
      domain: "colt.net"
    collector:
      type: "coverage_gap"
      reason: "Authenticated read-only Apigee number-management synthetic required. Retired SOAP host is excluded."

  - id: snpac
    name: "SNPAC / NUMPAC"
    category: "customer-critical"
    poll_interval: "1h"
    metadata:
      country_codes: ["SE"]
      dependency: "Swedish number portability database"
      coverage: "Not monitored: Confirm the production NUMPAC endpoint and access method, then add a read-only lookup synthetic; no verified public status feed."
      status_url: "https://snpac.se/"
      domain: "snpac.se"
    collector:
      type: "coverage_gap"
      reason: "Confirm the production NUMPAC endpoint and access method, then add a read-only lookup synthetic; no verified public status feed."

  - id: globalconnect-cdr
    name: "GlobalConnect — Norway CDR delivery"
    category: "customer-critical"
    poll_interval: "1h"
    metadata:
      country_codes: ["NO"]
      dependency: "Norwegian interconnect CDR retrieval"
      coverage: "Not monitored: SFTP host is configuration-driven; a file-freshness synthetic needs the configured endpoint and existing credentials."
      status_url: "https://globalconnect.no/"
      domain: "globalconnect.no"
    collector:
      type: "coverage_gap"
      reason: "SFTP host is configuration-driven; a file-freshness synthetic needs the configured endpoint and existing credentials."

  - id: cention
    name: "Cention"
