services:
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:0.70.3
    hostname: changedetection
    restart: unless-stopped
    depends_on:
      browser-sockpuppet-chrome:
        condition: service_started
    environment:
      BASE_URL: "${CHANGEDETECTION_BASE_URL:-}"
      FETCH_WORKERS: "${CHANGEDETECTION_FETCH_WORKERS:-4}"
      HIDE_REFERER: "true"
      LLM_FEATURES_DISABLED: "true"
      MINIMUM_SECONDS_RECHECK_TIME: "${CHANGEDETECTION_MINIMUM_RECHECK_SECONDS:-60}"
      PLAYWRIGHT_DRIVER_URL: ws://browser-sockpuppet-chrome:3000
      TZ: "${TZ:-Europe/Stockholm}"
      USE_X_SETTINGS: "1"
    ports:
      - "${CHANGEDETECTION_BIND_ADDRESS:-0.0.0.0}:${CHANGEDETECTION_PORT:-5000}:5000"
    volumes:
      - changedetection_data:/datastore
    networks:
      - tvx_skynet

  browser-sockpuppet-chrome:
    image: dgtlmoon/sockpuppetbrowser:latest
    hostname: browser-sockpuppet-chrome
    restart: unless-stopped
    init: true
    cap_add:
      - SYS_ADMIN
    environment:
      MAX_CONCURRENT_CHROME_PROCESSES: "${CHANGEDETECTION_BROWSER_WORKERS:-4}"
      SCREEN_DEPTH: "16"
      SCREEN_HEIGHT: "1024"
      SCREEN_WIDTH: "1920"
    shm_size: 2gb
    expose:
      - "3000"
    networks:
      - tvx_skynet

volumes:
  changedetection_data:
    name: tvx-skynet-changedetection-data

networks:
  tvx_skynet:
    external: true
    name: tvx-skynet
